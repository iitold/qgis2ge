name: Release qgis2ge Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package Plugin (Clean 25KB Distribution)
        run: |
          python -c "
          import os, zipfile
          zip_name = 'qgis2ge.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for root, dirs, files in os.walk('qgis2ge'):
                  # Exclude tests and pycache from release distribution
                  parts = set(root.split(os.sep))
                  if 'tests' in parts or '__pycache__' in parts:
                      continue
                  for f in sorted(files):
                      if f.endswith(('.pyc', '.pyo', '.bak', '.tmp')):
                          continue
                      fp = os.path.join(root, f)
                      arcname = os.path.relpath(fp, '.')
                      zf.write(fp, arcname)
                      print(f'Packed: {arcname}')
          print(f'Successfully built {zip_name} - Size: {os.path.getsize(zip_name)} bytes')
          "

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: qgis2ge.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
