name: Release qgis2ge Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package, Release and Publish to QGIS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build QGIS Compliant Distribution ZIP
        run: python scripts/build_zip.py

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qgis2ge.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install qgis-plugin-ci
        if: env.QGIS_TOKEN != '' || env.OSGEO_PASSWORD != ''
        run: pip install qgis-plugin-ci
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}

      - name: Deploy to QGIS Official Plugin Repository (via Token)
        if: env.QGIS_TOKEN != ''
        run: >-
          qgis-plugin-ci release ${{ github.ref_name }}
          --github-token ${{ secrets.GITHUB_TOKEN }}
          --qgis-token ${{ secrets.QGIS_TOKEN }}
        env:
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}

      - name: Deploy to QGIS Official Plugin Repository (via OSGeo User/Pass)
        if: env.QGIS_TOKEN == '' && env.OSGEO_PASSWORD != ''
        run: >-
          qgis-plugin-ci release ${{ github.ref_name }}
          --github-token ${{ secrets.GITHUB_TOKEN }}
          --osgeo-username ${{ secrets.OSGEO_USERNAME }}
          --osgeo-password ${{ secrets.OSGEO_PASSWORD }}
        env:
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
