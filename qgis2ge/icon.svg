<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#0F9D58" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
  </defs>

  <!-- Background shield / card -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Cellular / pie sectors with vivid colors -->
  <!-- Sector 1 (Blue) -->
  <path d="M 32 32 L 14 18 A 22 22 0 0 1 32 10 Z" fill="url(#grad2)" fill-opacity="0.85" stroke="#1A73E8" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Sector 2 (Green) -->
  <path d="M 32 32 L 32 10 A 22 22 0 0 1 50 18 Z" fill="url(#grad1)" fill-opacity="0.85" stroke="#0F9D58" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Sector 3 (Red/Yellow) -->
  <path d="M 32 32 L 50 18 A 22 22 0 0 1 48 46 Z" fill="url(#grad3)" fill-opacity="0.85" stroke="#EA4335" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Center tower / origin node -->
  <circle cx="32" cy="32" r="4.5" fill="#1E293B" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Export arrow badge in lower left -->
  <g transform="translate(8, 38)">
    <circle cx="12" cy="12" r="10" fill="#1A73E8"/>
    <path d="M 12 7 L 12 17 M 8 13 L 12 17 L 16 13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Text KML badge -->
  <rect x="36" y="43" width="20" height="11" rx="3" fill="#334155"/>
  <text x="46" y="51.5" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">KML</text>
</svg>
